name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Replace URLs in HTML files
        run: |
          OLD_URL="acover.vercel.app"
          NEW_URL="naeembolchhi.github.io/acover"

          # Find all HTML files and replace text
          find . -type f -name "*.html" -exec sed -i "s|$OLD_URL|$NEW_URL|g" {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4